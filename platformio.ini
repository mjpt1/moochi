; ============================================================
;  موچی ۲ — ESP32-C3 Super Mini
;  آپلود: در VS Code پایین صفحه دکمه‌ي → (Upload) را بزن.
;  اگر آپلود شروع نشد: دکمه‌ي BOOT را نگه دار ، RST را یک بار بزن ،
;  BOOT را ول کن و دوباره Upload بزن.
; ============================================================
[platformio]
; «pio run» فقط همین را بسازد (نه آپلود بی‌سیم را)
default_envs = moochi2
; رمز آپلود بی‌سیم در secrets.ini است (روی گیت‌هاب نمی‌رود) — secrets.example.ini را کپی کن
; OTA password lives in secrets.ini (git-ignored) — copy secrets.example.ini
extra_configs = secrets.ini

[env:moochi2]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
; دو جای ۱٫۹ مگابایتی برای برنامه تا آپدیت بی‌سیم (OTA) کار کند
board_build.partitions = min_spiffs.csv

; سریال از طریق خود USB برد (Super Mini چیپ مبدل جدا ندارد)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2 @ ^2.35.30
    adafruit/Adafruit NeoPixel @ ^1.12.3

monitor_speed = 115200
; اگر دو برد همزمان وصل بود ، شماره‌ي پورت را دستی بنویس:
;   upload_port  = COMx
;   monitor_port = COMx

; ---- آپلود بی‌سیم (بدون کابل) — بعد از اولین آپلود با کابل ----
;   & $pio run -e ota -t upload
[env:ota]
extends = env:moochi2
upload_protocol = espota
upload_port = moochi.local
upload_flags = --auth=moochi1234   ; secrets.ini این را عوض می‌کند / overridden by secrets.ini
